name: Work item
description: Track a planned implementation, test, build, or documentation task.
title: ''
labels: []
body:
    - type: textarea
      id: goal
      attributes:
          label: Goal
          description: Describe the outcome, not only the implementation steps.
      validations:
          required: true
    - type: textarea
      id: scope
      attributes:
          label: Scope
          description: List the concrete work included in this issue.
      validations:
          required: true
    - type: textarea
      id: acceptance
      attributes:
          label: Acceptance criteria
          description: List observable conditions that must be true before closing.
          placeholder: |
              - [ ] Criterion 1
              - [ ] Criterion 2
      validations:
          required: true
    - type: textarea
      id: tests
      attributes:
          label: Verification
          description: Describe automated and manual tests required for this work.
      validations:
          required: true
    - type: input
      id: documentation_ids
      attributes:
          label: Related documentation IDs
          description: List related RM-, IDEA-, FR-, NFR- or ADR identifiers, or write "None yet".
          placeholder: RM-002, NFR-006, ADR 0005
    - type: textarea
      id: documentation_impact
      attributes:
          label: Documentation impact
          description: State which requirements, decisions, workflows, user guidance or traceability links must change.
          placeholder: Describe updates, or explain why documentation is unaffected.
    - type: textarea
      id: dependencies
      attributes:
          label: Dependencies and blockers
          description: Link related issues or write "None".
