name: Bug report
description: Report reproducible incorrect plugin behavior.
title: '[Bug]: '
labels:
    - 'type:bug'
body:
    - type: textarea
      id: description
      attributes:
          label: Description
          description: What happened and what should have happened instead?
      validations:
          required: true
    - type: textarea
      id: reproduce
      attributes:
          label: Steps to reproduce
          placeholder: |
              1. Add the block
              2. Configure ...
              3. Observe ...
      validations:
          required: true
    - type: input
      id: versions
      attributes:
          label: Environment
          description: Plugin, WordPress, PHP, browser, and theme versions.
      validations:
          required: true
    - type: textarea
      id: logs
      attributes:
          label: Relevant logs or screenshots
          render: shell
