name: CI

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    NODE_VERSION: '20'

jobs:
    build-and-version:
        name: Build and version
        runs-on: ubuntu-24.04
        steps:
            - name: Check out repository
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
            - name: Set up Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
            - name: Install JavaScript dependencies
              run: npm ci
            - name: Install PHP dependencies
              run: npm run composer:install
            - name: Start WordPress test environment
              run: npm run env:test:start
            - name: Run formatting, lint, tests, translations and build
              run: YTPP_WP_ENV_CONFIG=.wp-env.test.json npm run check
            - name: Verify versions agree
              run: |
                  node <<'NODE'
                  const fs = require('fs');
                  const packageVersion = require('./package.json').version;
                  const plugin = fs.readFileSync('yt-playlist-player.php', 'utf8');
                  const header = plugin.match(/\n \* Version:\s+([^\n]+)/);
                  const constant = plugin.match(/YTPP_VERSION',\s*\n\s*'([^']+)'/);
                  const readme = fs.readFileSync('readme.txt', 'utf8');
                  const stableTag = readme.match(/Stable tag:\s*([^\s]+)/);
                  const versions = [packageVersion, header?.[1], constant?.[1], stableTag?.[1]];
                  if (versions.some((version) => !version) || new Set(versions).size !== 1) {
                    console.error('Version mismatch:', versions);
                    process.exit(1);
                  }
                  console.log(`Version ${packageVersion} is consistent.`);
                  NODE

    php:
        name: PHP ${{ matrix.php }}
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                php: ['8.0', '8.3']
        steps:
            - name: Check out repository
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
            - name: Set up PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: ${{ matrix.php }}
                  coverage: none
                  tools: composer:2.9.5
            - name: Install Composer dependencies
              run: composer install --no-interaction --prefer-dist --no-progress
            - name: Run PHP lint and tests
              run: composer run lint && composer run test

    javascript:
        name: JavaScript and CSS
        runs-on: ubuntu-24.04
        steps:
            - name: Check out repository
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
            - name: Set up Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
            - name: Install JavaScript dependencies
              run: npm ci
            - name: Run JavaScript, CSS and unit checks
              run: npm run lint:js && npm run lint:css && npm run test:js

    wordpress:
        name: WordPress integration, E2E and Plugin Check
        runs-on: ubuntu-24.04
        steps:
            - name: Check out repository
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
            - name: Set up Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
            - name: Install JavaScript dependencies
              run: npm ci
            - name: Run WordPress and browser quality gate
              run: npm run test:local

    ci-artifact:
        name: Upload CI plugin artifact
        runs-on: ubuntu-24.04
        needs: [build-and-version, php, javascript, wordpress]
        permissions:
            contents: read
            actions: write
        steps:
            - name: Check out repository
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
            - name: Set up Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
            - name: Install JavaScript dependencies
              run: npm ci
            - name: Build production assets
              run: npm run build
            - name: Stage production plugin files
              run: |
                  mkdir -p ci-artifact/yt-playlist-player
                  cp yt-playlist-player.php readme.txt LICENSE ci-artifact/yt-playlist-player/
                  cp -R build includes languages ci-artifact/yt-playlist-player/
            - name: Build checked plugin ZIP
              run: |
                  cd ci-artifact
                  zip -qr yt-playlist-player-ci.zip yt-playlist-player
                  sha256sum yt-playlist-player-ci.zip > yt-playlist-player-ci.zip.sha256
            - name: Upload plugin artifact
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: yt-playlist-player-ci-${{ github.run_id }}
                  path: |
                      ci-artifact/yt-playlist-player-ci.zip
                      ci-artifact/yt-playlist-player-ci.zip.sha256
                  retention-days: 3
