version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      groups:
          wordpress-development:
              patterns:
                  - '@wordpress/*'
          # markdownlint-cli pins markdownlint and markdown-it to narrow ranges,
          # and markdown-it is also an override; update them together.
          markdown-tooling:
              patterns:
                  - 'markdownlint'
                  - 'markdownlint-cli'
                  - 'markdown-it'

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
