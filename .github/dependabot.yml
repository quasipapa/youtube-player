version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      groups:
          wordpress-development:
              patterns:
                  - '@wordpress/*'
          # markdownlint-cli pins markdownlint and markdown-it to narrow ranges,
          # and markdown-it is also an override; update them together.
          markdown-tooling:
              patterns:
                  - 'markdownlint'
                  - 'markdownlint-cli'
                  - 'markdown-it'
          # Remaining minor and patch updates share one weekly PR so that
          # fewer PRs touch package-lock.json at the same time. A dependency
          # joins the first group it matches; major updates stay separate.
          development-minor-and-patch:
              patterns:
                  - '*'
              update-types:
                  - 'minor'
                  - 'patch'

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      groups:
          github-actions:
              patterns:
                  - '*'
